# CI/CD Workflow - Main Pipeline
# Runs on all PRs and pushes to main branch
# Uses Turborepo for efficient caching and parallel execution

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # ============================================
  # Setup and Cache Dependencies
  # ============================================
  setup:
    name: 📦 Setup
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Cache node_modules
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

  # ============================================
  # Lint All Apps
  # ============================================
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run linting
        run: yarn lint

  # ============================================
  # Type Check All Apps
  # ============================================
  typecheck:
    name: 📝 Type Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run type checking
        run: yarn check-types

  # ============================================
  # Build All Apps
  # ============================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build all apps
        run: yarn build

      - name: Upload web build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/dist
          retention-days: 7

  # ============================================
  # Final Status Check
  # ============================================
  status-check:
    name: CI
    runs-on: ubuntu-latest
    needs: [build] # Only runs if 'build' (and its dependencies) pass
    if: always()
    steps:
      - name: Check overall status
        run: |
          if [[ "${{ needs.build.result }}" == "success" ]]; then
            echo "All checks passed"
            exit 0
          else
            echo "One or more checks failed"
            exit 1
          fi

  # ============================================
  # Create Issue On CI Failure (pushes only)
  # ============================================
  create_issue:
    name: 🐞 Create CI Failure Issue
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build]
    if: ${{ always() && (needs.lint.result == 'failure' || needs.typecheck.result == 'failure' || needs.build.result == 'failure') && github.event_name == 'push' }}
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
            web:
              - 'apps/web/**'
            mobile:
              - 'apps/mobile/**'

      - name: Create issue and assign owners
        uses: actions/github-script@v7
        env:
          API_CHANGED: ${{ steps.filter.outputs.api }}
          WEB_CHANGED: ${{ steps.filter.outputs.web }}
          MOBILE_CHANGED: ${{ steps.filter.outputs.mobile }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          script: |
            const apiChanged = process.env.API_CHANGED === 'true';
            const webChanged = process.env.WEB_CHANGED === 'true';
            const mobileChanged = process.env.MOBILE_CHANGED === 'true';

            const assignees = [];
            const apps = [];

            if (apiChanged) {
              apps.push('api');
              assignees.push('Barnabas05');
            }
            if (webChanged) {
              apps.push('web');
              if (!assignees.includes('Barnabas05')) assignees.push('Barnabas05');
            }
            if (mobileChanged) {
              apps.push('mobile');
              assignees.push('TibeeTheOnly');
            }

            const failedStages = [];
            if (process.env.LINT_RESULT === 'failure') failedStages.push('Lint');
            if (process.env.TYPECHECK_RESULT === 'failure') failedStages.push('Type Check');
            if (process.env.BUILD_RESULT === 'failure') failedStages.push('Build');

            const stagesText = failedStages.join(', ');
            const appsText = apps.length ? apps.join(', ') : 'unknown';
            const title = '🚨 CI Failed (' + stagesText + '): ' + appsText;
            const appsList = apps.length ? apps.map(app => '- `' + app + '`').join('\n') : 'Unable to detect changed apps';
            const body = '## CI Failure\n\n' +
              '**Failed Stages:** ' + stagesText + '\n' +
              '**Commit:** ' + context.sha.substring(0, 7) + '\n' +
              '**Branch:** ' + context.ref.replace('refs/heads/', '') + '\n' +
              '**Author:** @' + context.actor + '\n' +
              '**Run:** ' + context.payload.repository.html_url + '/actions/runs/' + context.runId + '\n\n' +
              '### Affected Apps\n' + appsList + '\n\n' +
              '### Action Required\n' +
              'Please review the failed CI run and fix the issues in your app.\n\n' +
              '---\n' +
              '*This issue was automatically created by the CI workflow*';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              assignees: assignees.length ? assignees : undefined,
              labels: ['ci-failure', 'bug']
            });
