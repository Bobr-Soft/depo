name: Build and Release

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  # 1. Build Android Job
  build-android:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack & Install
        run: |
          corepack enable
          yarn install --immutable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          cd apps/mobile
          npx expo prebuild --platform android
          cd android
          ./gradlew assembleRelease
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk

  # 2. Build iOS Job (Unsigned for Sideloading)
  build-ios:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack & Install
        run: |
          corepack enable
          yarn install --immutable

      - name: Setup Expo/EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Unsigned IPA
        working-directory: apps/mobile
        run: |
          # 1. Generate native iOS project from the mobile app root
          npx expo prebuild --platform ios --no-install --clean

          # 2. Install CocoaPods
          cd ios
          pod install

          # 3. Build (unsigned, for sideloading)
          xcodebuild build \
            -workspace depomobile.xcworkspace \
            -scheme depomobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -derivedDataPath build

          # 4. Package into .ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/depomobile.app Payload/
          zip -r unsigned-app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: apps/mobile/ios/unsigned-app.ipa

  # 3. Update Release Draft (runs on all events)
  update-release-draft:
    needs: [build-android, build-ios]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release_drafter.outputs.tag_name }}
    steps:
      - name: Draft Release Notes
        id: release_drafter
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 4. Upload Release Assets (runs only on main branch pushes after builds complete)
  upload-release-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-android, build-ios, update-release-draft]
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-build'
          merge-multiple: true

      - name: Upload Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.update-release-draft.outputs.tag_name }}
          files: |
            android-build/*.apk
            ios-build/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 5. Upload Nightly Assets (runs only on dev branch pushes)
  upload-nightly-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-build'
          merge-multiple: true

      - name: Upload Nightly Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build"
          body: |
            Automated nightly build from the `dev` branch.
            Commit: ${{ github.sha }}
            Built: ${{ github.run_id }}
          prerelease: true
          make_latest: false
          files: |
            android-build/*.apk
            ios-build/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
