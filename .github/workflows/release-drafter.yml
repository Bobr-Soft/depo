name: Build and Release

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  # 1. Build Android Job
  build-android:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack & Install
        run: |
          corepack enable
          yarn install --immutable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          cd apps/mobile
          npx expo prebuild --platform android
          cd android
          ./gradlew assembleRelease
      - name: Copy APK to output
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/release/*.apk out/depo.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: out/depo.apk

  # 2. Build iOS Job (Unsigned for Sideloading)
  build-ios:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: macos-latest
    env:
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack & Install
        run: |
          corepack enable
          yarn install --immutable

      - name: Setup Expo/EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Unsigned IPA
        working-directory: apps/mobile
        run: |
          # 1. Generate native iOS project from the mobile app root
          npx expo prebuild --platform ios --no-install --clean

          # 2. Install CocoaPods
          cd ios
          pod install

          # 3. Build (unsigned, for sideloading)
          xcodebuild build \
            -workspace depomobile.xcworkspace \
            -scheme depomobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -derivedDataPath build

          # 4. Package into .ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/depomobile.app Payload/
          zip -r unsigned-app.ipa Payload
          mkdir -p ${{ github.workspace }}/out
          cp unsigned-app.ipa ${{ github.workspace }}/out/depo.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: out/depo.ipa

  # 3. Create Release on Main Branch
  create-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Tag Name
        id: tag
        run: |
          TAG="v$(date +%Y.%m.%d-%H%M%S)"
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Release ${{ steps.tag.outputs.tag_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 4. Upload Release Assets (Main Branch)
  upload-release-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-android, build-ios, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: android-build

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: ios-build

      - name: Upload Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: |
            android-build/*.apk
            ios-build/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 5. Upload Nightly Assets (runs only on dev branch pushes)
  upload-nightly-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: android-build

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: ios-build

      - name: Delete Previous Nightly Release
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const releases = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo
              });

              const nightlyRelease = releases.data.find(r => r.tag_name === 'nightly');

              if (nightlyRelease) {
                // Delete the release
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: nightlyRelease.id
                });

                // Delete the tag
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: 'tags/nightly'
                });
              }
            } catch (error) {
              console.log('No previous nightly release found');
            }

      - name: Upload Nightly Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build"
          body: |
            ## Nightly Build
            Latest development build from the `dev` branch.

            - iOS App (unsigned IPA)
            - Android App (APK)

            Commit: ${{ github.sha }}
            Built: ${{ github.run_id }}
            Timestamp: ${{ github.event.head_commit.timestamp }}
          prerelease: true
          make_latest: false
          files: |
            android-build/*.apk
            ios-build/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
