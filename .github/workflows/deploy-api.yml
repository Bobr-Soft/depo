name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # Test API (Runs on GitHub Cloud)
  # ============================================
  test:
    name: 🧪 Test API
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_TEST_DB_PASSWORD }}
          MYSQL_DATABASE: depo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run API tests
        working-directory: apps/api
        run: yarn test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ${{ secrets.CI_TEST_DB_PASSWORD }}
          DB_NAME: depo_test
          JWT_SECRET: ${{ secrets.CI_TEST_JWT_SECRET }}

  # ============================================
  # Deploy API (Runs on Private Proxmox LXC)
  # ============================================
  deploy:
    name: 🚀 Deploy API (Self-Hosted)
    runs-on: [self-hosted, depo-backend]
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Clean Workspace
        run: |
          rm -rf ${{ github.workspace }}/* || true
          rm -rf ${{ github.workspace }}/.* || true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Inject Production Configurations
        working-directory: apps/api
        env:
          API_ENV_FILE: ${{ secrets['API_ENV_FILE'] }}
        run: |
          if [ -f /opt/depo-config/api/.env ]; then
            cp /opt/depo-config/api/.env .env
            echo "Using runner env file from /opt/depo-config/api/.env"
          elif [ -n "${API_ENV_FILE}" ]; then
            printf '%s\n' "${API_ENV_FILE}" > .env
            echo "Using API_ENV_FILE secret"
          else
            echo "Missing env source. Provide /opt/depo-config/api/.env on runner or set API_ENV_FILE secret." >&2
            exit 1
          fi
          chmod 600 .env

      - name: Deploy API with PM2
        working-directory: apps/api
        run: |
          yarn dlx pm2 describe depo-api > /dev/null 2>&1 \
            && yarn dlx pm2 restart depo-api --update-env \
            || yarn dlx pm2 start index.js --name depo-api --update-env
          yarn dlx pm2 save --force

      - name: Show PM2 process status
        run: |
          yarn dlx pm2 status
