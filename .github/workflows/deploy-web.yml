name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/ui/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    name: 🚀 Deploy Web App
    runs-on: [self-hosted, depo-frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build web app
        # Ensure 'frontend' matches the actual package name in your apps/web/package.json
        run: yarn workspace frontend build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_AZURE_CLIENT_ID: ${{ secrets.VITE_AZURE_CLIENT_ID }}
          VITE_AZURE_TENANT_ID: ${{ secrets.VITE_AZURE_TENANT_ID }}

      - name: Deploy and Serve (PM2 via Yarn)
        working-directory: apps/web
        # Uses yarn dlx to execute PM2 securely within the Corepack context.
        # It attempts to start a new server; if the process name already exists, it restarts it.
        run: |
          yarn dlx pm2 serve dist 3000 --name "depo-web" --spa || yarn dlx pm2 restart depo-web

      - name: Deployment complete
        run: echo "✅ Web app deployed successfully on Proxmox frontend LXC!"
