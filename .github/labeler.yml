# PR Labeler Configuration
# Labels PRs automatically based on changed files

# Area labels
area:web:
  - changed-files:
      - any-glob-to-any-file: 'apps/web/**'

area:mobile:
  - changed-files:
      - any-glob-to-any-file: 'apps/mobile/**'

area:api:
  - changed-files:
      - any-glob-to-any-file: 'apps/api/**'

# Package labels
packages:
  - changed-files:
      - any-glob-to-any-file: 'packages/**'

ui:
  - changed-files:
      - any-glob-to-any-file: 'packages/ui/**'

# Type labels
area:docs:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - '**/package.json'
          - '**/yarn.lock'

config:
  - changed-files:
      - any-glob-to-any-file:
          - '*.json'
          - '*.yml'
          - '*.yaml'
          - '.github/**'

github-actions:
  - changed-files:
      - any-glob-to-any-file: '.github/workflows/**'
